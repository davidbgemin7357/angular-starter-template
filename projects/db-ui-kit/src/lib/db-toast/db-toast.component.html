<div
  class="toast-container"
  [class.show]="visible"
  [class.hide]="!visible"
  [style.--db-toast-offset.px]="stackOffset"
  [style.--db-toast-opacity]="stackOpacity"
>
  <div class="toast db-glass-gloss" [ngClass]="variantClass">
    <span class="icon material-symbols-outlined"> {{ iconName }}</span>
    <div class="message">
      {{ message }}
    </div>
  </div>
</div>
