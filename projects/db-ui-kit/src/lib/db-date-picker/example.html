  <db-date-picker
    [label]="'Hora (time)'"
    [placeholder]="'Seleccione hora'"
    [mode]="'time'"
    [value]="'14:30:45'"
    [showClearButton]="true"
    [required]="true"
  ></db-date-picker>


  <!-- Caso 1: mode "single" con value: string 'dd/mm/YYYY' y showClearButton -->
  <db-date-picker
    [label]="'Fecha (single)'"
    [placeholder]="'Seleccione fecha'"
    [mode]="'single'"
    [value]="'25/12/2025'"
    [required]="true"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Nota (range/multiple): el valor emitido al formulario (onChange) es un string[] de
       fechas LOCALES en el formato configurado ('YYYY-MM-DD' por defecto, 'DD-MM-YYYY' con
       format="dmy"), ya no strings ISO UTC. writeValue acepta esos strings, Date, y (por
       compatibilidad) strings ISO completos con 'T'. -->

  <!-- Caso 2: mode "multiple" con value: string[] 'dd/mm/YYYY' -->
  <db-date-picker
    [label]="'Fechas (multiple)'"
    [placeholder]="'Seleccione fechas'"
    [mode]="'multiple'"
    [value]="['01/01/2025', '15/01/2025', '28/02/2025']"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Caso 3: mode "range" con value: { startDate, endDate } en 'dd/mm/YYYY' -->
  <db-date-picker
    [label]="'Rango (range)'"
    [placeholder]="'Seleccione un rango'"
    [mode]="'range'"
    [value]="{ startDate: '01/03/2025', endDate: '10/03/2025' }"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Caso 4: mode "time" con value: string 'HH:mm:ss' (muestra segundos) -->
  <db-date-picker
    [label]="'Hora con segundos (time)'"
    [placeholder]="'Seleccione hora'"
    [mode]="'time'"
    [value]="'14:30:45'"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Caso 4b: mode "time" con value: string 'HH:mm' (sin segundos) -->
  <db-date-picker
    [label]="'Hora sin segundos (time)'"
    [placeholder]="'Seleccione hora'"
    [mode]="'time'"
    [value]="'14:30'"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Caso 6: mode "datetime" con value: string 'dd/mm/YYYY HH:mm:ss' (también acepta
       'YYYY-MM-DD HH:mm[:ss]', que es el formato que muestra y emite) -->
  <db-date-picker
    [label]="'Fecha y hora (datetime)'"
    [placeholder]="'Seleccione fecha y hora'"
    [mode]="'datetime'"
    [value]="'25/12/2025 14:30:45'"
    [showClearButton]="true"
  ></db-date-picker>

  <!-- Caso 5: disabled -->
  <db-date-picker
    [label]="'Deshabilitado'"
    [placeholder]="'Seleccione fecha'"
    [mode]="'single'"
    [value]="'25/12/2025'"
    [disabled]="true"
    [showClearButton]="true"
  ></db-date-picker>
