<!-- Caso 1: texto al pasar el mouse (por defecto: top, fade) -->
<span #ayuda class="material-symbols-outlined">help</span>
<db-tooltip [target]="ayuda">Texto de ayuda</db-tooltip>

<!-- Caso 2: plantilla rica a la derecha, con animación pop -->
<img #producto src="tv.png" alt="TV" class="h-16 w-16" />
<db-tooltip [target]="producto" position="right" animation="pop">
  <img src="tv.png" alt="" class="h-32 w-40 object-contain" />
  <p class="font-semibold">SuperPlasma 50</p>
  <p>2400$</p>
</db-tooltip>

<!-- Caso 3: abrir con clic (se cierra con clic fuera o Escape) -->
<button #info type="button">Info</button>
<db-tooltip [target]="info" showEvent="click" position="bottom">Detalle</db-tooltip>

<!-- Caso 4: al enfocar un campo (focusin burbujea, sirve un contenedor) -->
<div #campo><db-text-box [label]="'Código'"></db-text-box></div>
<db-tooltip [target]="campo" showEvent="focus" position="bottom">Mínimo 3 caracteres</db-tooltip>

<!-- Caso 5: controlado desde el padre -->
<span #marca>Objetivo</span>
<db-tooltip [target]="marca" [(visible)]="mostrarTooltip">Controlado</db-tooltip>

<!-- Nota: sobre un componente (p. ej. <db-button #btn>) la variable de plantilla es la instancia
     del componente, no el elemento. Usa un contenedor o un selector: [target]="'#mi-boton'". -->
