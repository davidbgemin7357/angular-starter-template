<div class="relative inline-block">
  <!-- El atributo nativo, y no solo las clases de "deshabilitado": asi el navegador bloquea el
       clic, el foco y la activacion por teclado, en vez de depender de que cada handler se
       acuerde de chequear la bandera. Es lo que impide disparar dos veces una accion en curso. -->
  <button
    type="button"
    [disabled]="disabled"
    class="db-glass-gloss"
    [ngClass]="classes"
    (click)="onClick($event)"
  >
    @if (startIcon) {
      <span class="icon-rotate flex items-center material-symbols-outlined">{{ startIcon }}</span>
    }
    <ng-content />
    @if (endIcon) {
      <span class="icon-rotate flex items-center material-symbols-outlined">{{ endIcon }}</span>
    }
    @if (dropdownItems?.length) {
      <span class="dropdown-divider self-stretch"></span>
      <span class="flex items-center material-symbols-outlined">keyboard_arrow_down</span>
    }
  </button>

  @if (dropdownItems?.length && isDropdownOpen) {
    <!-- preventDefault en mousedown: sin esto el clic en una opcion sacaria el foco del boton,
         focusout cerraria la lista y el <li> desapareceria antes de que llegara su click. -->
    <ul
      class="dropdown-menu db-glass-panel absolute left-0 top-full z-50 mt-1 min-w-[180px] rounded-lg border border-gray-200 bg-white p-1 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark"
      (mousedown)="$event.preventDefault()"
    >
      @for (item of dropdownItems; track item.text) {
        <li
          class="flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
          (click)="onDropdownItemClick(item)"
        >
          @if (item.icon) {
            <span class="material-symbols-outlined">{{ item.icon }}</span>
          }
          <span>{{ item.text }}</span>
        </li>
      }
    </ul>
  }
</div>
