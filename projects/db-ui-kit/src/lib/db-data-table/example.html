  <!-- ================= EJEMPLO 1: con toolbar, selección múltiple y sub-acciones ================= -->
  <div>
    <h3 class="text-lg font-semibold mb-2">DbDataTableComponent - Ejemplo 1 (completo)</h3>
    <div class="h-100">
      <db-data-table
        [data]="tableOneData"
        [columns]="tableOneColumns"
        [actions]="tableOneActions"
        [selectMultiple]="true"
        [selectableRows]="tableOneSelectableRows"
        [showToolbar]="true"
        [totalRows]="tableOneTotalRows"
        [totalPages]="tableOneTotalPages"
        [rowsPerPage]="tableOneRowsPerPage"
        [noDataMessage]="'No hay resultados en esta tabla'"
        [reorderableColumns]="true"
        [summary]="tableOneSummary"
        (currentPageEmit)="onTableOnePage($event)"
        (emitAction)="onTableOneAction($event)"
      ></db-data-table>
    </div>
  </div>



    <!-- ================= EJEMPLO 2: sin toolbar, sin selección, menú de acciones colapsado ================= -->
  <div>
    <h3 class="text-lg font-semibold mb-2">DbDataTableComponent - Ejemplo 2 (simple)</h3>
    <div class="h-100">
      <db-data-table
        [data]="tableTwoData"
        [columns]="tableTwoColumns"
        [actions]="tableTwoActions"
        [selectMultiple]="false"
        [selectableRows]="null"
        [showToolbar]="false"
        [totalRows]="tableTwoTotalRows"
        [zebraRows]="true"
        [totalPages]="tableTwoTotalPages"
        [rowsPerPage]="tableTwoRowsPerPage"
        (currentPageEmit)="onTableTwoPage($event)"
        (emitAction)="onTableTwoAction($event)"
      ></db-data-table>
    </div>
  </div>
