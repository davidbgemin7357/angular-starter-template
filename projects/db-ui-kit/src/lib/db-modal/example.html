    <db-button (btnClick)="openSampleModal()" [variant]="'primary'">
      Abrir modal
    </db-button>

    <db-modal
      [isOpen]="isSampleModalOpen"
      (close)="closeSampleModal()"
      [title]="'Modal de ejemplo'"
      [className]="'max-w-md'"
      [showCloseButton]="false"
      [hideOnOutsideClick]="false"
    >
      <p class="p-5 text-sm text-gray-500 dark:text-gray-400">
        Este es el contenido del modal mostrado con DbModalComponent.
      </p>
    </db-modal>
