<!-- Caso 1: variantes de color (variant="light" por defecto) -->
<db-badge [color]="'primary'">Primary</db-badge>
<db-badge [color]="'success'">Success</db-badge>
<db-badge [color]="'error'">Error</db-badge>
<db-badge [color]="'warning'">Warning</db-badge>
<db-badge [color]="'info'">Info</db-badge>
<db-badge [color]="'light'">Light</db-badge>
<db-badge [color]="'dark'">Dark</db-badge>

<!-- Caso 2: variant solid -->
<db-badge [variant]="'solid'" [color]="'primary'">Primary</db-badge>
<db-badge [variant]="'solid'" [color]="'success'">Success</db-badge>

<!-- Caso 3: tamaños -->
<db-badge [size]="'sm'" [color]="'primary'">Small</db-badge>
<db-badge [size]="'md'" [color]="'primary'">Medium</db-badge>

<!-- Caso 4: con íconos -->
<db-badge [color]="'success'" [startIcon]="'check_circle'">Aprobado</db-badge>
<db-badge [color]="'error'" [endIcon]="'close'">Rechazado</db-badge>

<!-- Caso 5: eventos de click en íconos y contenido -->
<db-badge
  [color]="'warning'"
  [startIcon]="'close'"
  [endIcon]="'favorite'"
  (iconClick)="onBadgeIconClick($event)"
  (contentClick)="onBadgeContentClick()"
>Pendiente</db-badge>
