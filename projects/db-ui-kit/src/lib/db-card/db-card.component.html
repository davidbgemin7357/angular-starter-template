<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] {{ className }}">
  <!-- Card Header -->
  <div class="px-4 py-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
    <div class="min-w-0">
      <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
        {{ title }}
      </h3>
      @if (desc) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        {{ desc }}
      </p>
      }
    </div>

    <!-- Acciones opcionales de la cabecera. El ng-content va suelto, sin div contenedor: asi
         una card sin acciones no gana un hijo vacio que el gap del flex separaria igual,
         sumando alto a todas las cards que no usan el slot. -->
    <ng-content select="[cardActions]"></ng-content>
  </div>

  <!-- Card Body -->
  <div class="p-3 border-t border-gray-100 dark:border-gray-800 sm:p-4">
    <div class="space-y-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
