<!-- Caso 1: básico -->
<db-text-area
  [label]="'Comentario'"
  [placeholder]="'Escribe tu comentario'"
></db-text-area>

<!-- Caso 2: requerido con límite de caracteres y botón de limpiar -->
<db-text-area
  [label]="'Mensaje'"
  [required]="true"
  [minLength]="10"
  [maxLength]="500"
  [showClearButton]="true"
  [hint]="'Entre 10 y 500 caracteres'"
></db-text-area>

<!-- Caso 3: con más filas y estado de error -->
<db-text-area
  [label]="'Descripción'"
  [rows]="6"
  [error]="true"
  [hint]="'Este campo es obligatorio'"
></db-text-area>

<!-- Caso 4: deshabilitado -->
<db-text-area
  [label]="'Observaciones'"
  [disabled]="true"
  [placeholder]="'No editable'"
></db-text-area>

<!-- Caso 5: solo letras y espacios (regexp por carácter; los saltos de línea se conservan) -->
<db-text-area
  [label]="'Nombres'"
  [regexp]="'[a-zA-ZáéíóúÁÉÍÓÚñÑ ]'"
></db-text-area>

<!-- Caso 6: uso con formularios reactivos (ControlValueAccessor) -->
<db-text-area
  [label]="'Notas'"
  formControlName="notas"
  [required]="true"
></db-text-area>
