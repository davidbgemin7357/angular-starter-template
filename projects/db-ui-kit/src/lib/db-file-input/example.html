<!-- Caso 1: multiple = false -->
<db-file-input
  [allowedExtensions]="['.jpg', '.jpeg', '.png']"
  [multiple]="false"
  [required]="true"
  [showClearButton]="true"
></db-file-input>

<!-- Caso 2: multiple = true -->
<db-file-input
  [allowedExtensions]="['.jpg', '.jpeg', '.png']"
  [multiple]="true"
  [required]="true"
  [showClearButton]="true"
></db-file-input>
