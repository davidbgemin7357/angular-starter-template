   <label
      class="flex select-none items-center gap-3 text-sm font-medium"
      [ngClass]="disabled ? 'cursor-not-allowed opacity-60 text-gray-400' : 'cursor-pointer text-gray-700 dark:text-gray-400'"
    >
      <input
        type="checkbox"
        role="switch"
        class="sr-only"
        [checked]="isChecked"
        [disabled]="disabled"
        [attr.aria-checked]="isChecked"
        [attr.aria-label]="label || null"
        (change)="onToggle($event)"
      />
      <span class="relative">
        <span
          class="db-glass-gloss block transition duration-150 ease-linear h-6 w-11 rounded-full"
          [ngClass]="switchColors.background"
        ></span>
        <span
          class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full shadow-theme-sm duration-150 ease-linear transform"
          [ngClass]="switchColors.knob"
        ></span>
      </span>
      {{ label }}
    </label>
