@if (shouldRender) {
  <div class="fixed inset-0 flex items-center justify-center overflow-y-auto modal z-99999">
    @if (!isFullscreen) {
      <div
        class="modal-backdrop fixed inset-0 h-full w-full bg-gray-400/50 backdrop-blur-[32px]"
        [class.modal-visible]="isVisible"
        (click)="onBackdropClick($event)"
      ></div>
    }
    <div
      [ngClass]="
        isFullscreen
          ? 'w-full h-full'
          : 'db-glass-surface animated-border modal-content relative w-auto min-w-72 rounded-lg border bg-white dark:bg-gray-900'
      "
      [class.modal-visible]="isVisible"
      [class]="className"
      (click)="onContentClick($event)"
    >
      @if (showCloseButton && !title) {
        <button type="button"
          (click)="close.emit()"
          class="absolute top-2 right-2 z-999 flex h-6 w-6 select-none items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fillRule="evenodd"
              clipRule="evenodd"
              d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
              fill="currentColor"
            />
          </svg>
        </button>
      }
      <div>
        @if (title) {
          <div class="flex items-center justify-between gap-2 border-b border-gray-200 px-4 py-2.5 dark:border-gray-800">
            <h3 class="text-base font-semibold text-gray-800 select-none dark:text-white/90">{{ title }}</h3>
            @if (showCloseButton) {
              <button type="button"
                (click)="close.emit()"
                class="z-999 flex h-6 w-6 shrink-0 select-none items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fillRule="evenodd"
                    clipRule="evenodd"
                    d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
                    fill="currentColor"
                  />
                </svg>
              </button>
            }
          </div>
        }
        <div class="p-5 text-center font-sans">
          <p class="mb-4 text-sm pr-6 max-w-xs wrap-break-words select-none">{{ message }}</p>

          <div class="flex justify-center gap-3">
            <db-button
              size="sm"
              [variant]="'primary'"
              [type]="'outline'"
              [startIcon]="'check'"
              (btnClick)="confirm.emit(true)"
            >
              Confirmar
            </db-button>

            <db-button
              size="sm"
              [variant]="'error'"
              [type]="'outline'"
              [startIcon]="'close'"
              (btnClick)="confirm.emit(false)"
            >
              Cancelar
            </db-button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
