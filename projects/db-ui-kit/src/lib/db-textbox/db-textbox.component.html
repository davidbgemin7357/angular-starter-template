<div class="w-full">
  <div class="relative">
    @if (label) {
      <label [for]="id" class="db-glass-label absolute left-4 top-0 z-20 -translate-y-1/2 bg-white px-1 text-xs font-medium text-gray-600 dark:bg-gray-900 dark:text-gray-200 select-none">
        {{ label }}
        @if (required) {
          <span class="ml-1 text-red-500">*</span>
        }
      </label>
    }

    <div class="relative">
      @if (icon) {
        <span
          class="pointer-events-none absolute left-0 top-1/2 z-10 flex h-11 w-11.5 -translate-y-1/2 items-center justify-center border-r border-gray-200 text-gray-500 dark:border-gray-800 dark:text-gray-400"
        >
          <span class="material-symbols-outlined text-lg">{{ icon }}</span>
        </span>
      }

      <input
        class="db-glass-control"
        #inputRef
        [type]="inputType"
        [id]="id"
        [name]="name"
        [placeholder]="placeholder"
        [disabled]="disabled"
        [ngClass]="inputClasses"
        [attr.maxLength]="maxLength"
        [attr.minLength]="minLength"
        (input)="onInput($event)"
        (blur)="handleBlur()"
        [style.padding-right.rem]="inputPaddingRight"
        [style.padding-left.rem]="inputPaddingLeft"
      />

      @if (showClearButton && value) {
        <button
          type="button"
          tabindex="-1"
          class="clear-button"
          [style.right.rem]="clearButtonRightOffset"
          [disabled]="disabled"
          (click)="clearValue()"
          aria-label="Limpiar contenido"
          title="Limpiar contenido"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6L6 18" />
          </svg>
        </button>
      }

      @if (type === 'password') {
        <button
          type="button"
          class="password-toggle"
          [disabled]="disabled"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="isPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.title]="isPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (isPasswordVisible) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3 3.8" />
              <path d="M14.1 14.1A3 3 0 0 1 9.9 9.9" />
              <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.3-.9" />
              <path d="M2 2l20 20" />
            </svg>
          }
        </button>
      }
    </div>

    @if (required || type === 'email') {
      <div class="min-h-6">
        @if (computedHint) {
          <p
            class="mt-1.5 text-xs absolute"
            [ngClass]="{
              'text-error-500': computedError,
              'text-success-500': success,
              'text-gray-500': !computedError && !success,
            }"
          >
            {{ computedHint }}
          </p>
        }
      </div>
    }
  </div>
</div>
