  <db-select-box
    [placeholder]="'Select an option'"
    [required]="true"
    [options]="[
      { code: '1', name: 'Option 1', active: true, color: 'success', icon: 'check' },
      { code: '2', name: 'Option 2', active: false, color: 'danger', icon: 'close' },
      { code: '3', name: 'Option 3', active: true, color: 'warning', icon: 'favorite' }
    ]"
    [label]="'Select an option'"
    [showClearButton]="true"
  ></db-select-box>







      <!-- DbSelectBoxComponent -->
      <div class="flex min-w-0 flex-col gap-3 rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-white/90">DbSelectBoxComponent</h3>
        <db-select-box
          [label]="'País'"
          [options]="selectOptions"
          [(ngModel)]="selectValue"
          [placeholder]="'Selecciona un país'"
          [showClearButton]="true"
          (optionSelected)="onSelectOptionSelected($event)"
        ></db-select-box>
      </div>
